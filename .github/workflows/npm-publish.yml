# Publish the package to npm whenever a version tag (v*) is pushed.
# The package is tested before publishing.

name: Publish npm package

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  id-token: write

jobs:
  npm-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
      - run: npm publish --provenance
